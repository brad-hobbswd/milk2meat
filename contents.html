<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:#0d1117;
--bg2:#161b22;
--gold:#d9b26c;
--text:#d5d5d5;
--border:#2a2f36;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--bg);
font-family:Georgia,serif;
color:var(--text);
line-height:1.7;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
}

.top{
text-align:center;
margin-bottom:40px;
}

.top h1{
font-size:clamp(2rem,6vw,3.5rem);
color:var(--gold);
margin-bottom:10px;
}

.top p{
opacity:.8;
}

.contents{
background:var(--bg2);
border-radius:25px;
padding:25px;
border:1px solid var(--border);
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.contents a{
display:block;
padding:18px;
text-decoration:none;
color:var(--text);
font-size:1.05rem;
border-bottom:1px solid var(--border);
transition:.3s;
}

.contents a:last-child{
border-bottom:none;
}

.contents a:hover,
.contents a:focus-visible{
padding-left:30px;
color:var(--gold);
}

.back{
text-align:center;
margin-top:30px;
}

.btn{
display:inline-block;
padding:14px 35px;
background:var(--gold);
color:#0d1117;
text-decoration:none;
font-weight:bold;
border-radius:30px;
transition:.3s;
}

.btn:hover,
.btn:focus-visible{
transform:translateY(-3px);
}

.contents a:focus-visible,
.btn:focus-visible{
outline:3px solid var(--gold);
outline-offset:4px;
}

.footer-frame{
width:100%;
border:none;
display:block;
margin-top:50px;
height:620px;
}

@media(max-width:600px){

body{
padding:18px;
}

.top{
margin-bottom:28px;
}

.contents{
padding:12px;
border-radius:18px;
}

.contents a{
padding:15px 12px;
font-size:1rem;
}

.contents a:hover,
.contents a:focus-visible{
padding-left:18px;
}

.footer-frame{
margin-top:40px;
height:760px;
}

}

</style>

</head>

<body>

src="footer.html"
class="footer-frame"
title="Site footer"
scrolling="no">
</iframe>

</div>

<script>

function resizeFooterFrame(){

const frame=document.querySelector('.footer-frame');

if(!frame){return;}

try{

const height=frame.contentDocument.documentElement.scrollHeight;

if(height>0){
frame.style.height=(height+4)+'px';
}

}catch(error){

}

}

window.addEventListener('load',function(){

const frame=document.querySelector('.footer-frame');

if(frame){
frame.addEventListener('load',resizeFooterFrame);
}

resizeFooterFrame();
setTimeout(resizeFooterFrame,250);
setTimeout(resizeFooterFrame,750);

});

window.addEventListener('resize',resizeFooterFrame);

</script>

</body>
